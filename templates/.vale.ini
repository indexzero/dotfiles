# Drop-in per-project Vale config (see https://github.com/Syntaf/vale-llm-slop).
# After copying into a project, run `vale sync` to fetch the packages.
#
# STE is strict and needs a project technical-noun vocabulary, or it flags
# every domain term you use correctly (STE §1.8). Create:
#   .vale/config/vocabularies/<Project>/accept.txt
# and list your markdown constructs, tool names, and domain nouns there.

StylesPath = .vale
MinAlertLevel = warning
Vocab = Project
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

# Docstrings and comments in source files
[*.{py,cs,ts,tsx,js,go,rs,rb,java,kt,swift,php,c,cpp,h}]
BasedOnStyles = Slop

# Agent-authored specs, plans and docs — enforce STE (strict)
[*.md]
BasedOnStyles = Slop, STE
