# Global fallback config — used when a project has no .vale.ini of its own.
# Symlinked to ~/Library/Application Support/vale by ./install/vale.
#
# Slop ONLY. STE and STE.DictionaryFull are deliberately NOT enabled globally:
# they need a per-project technical-noun Vocab (STE §1.8) or they flag every
# domain term used correctly. Measured on one corpus: 816 findings without a
# Vocab, 639 with one, and the dictionary alone accounted for 806 of the 816.
# For a project that wants STE, copy templates/.vale.ini and add a Vocab.
#
# The package is PINNED. `releases/latest` moves the ruleset under you and
# changes eval numbers with no code change.

StylesPath = styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

# Docstrings and comments in source files
[*.{py,cs,ts,tsx,js,go,rs,rb,java,kt,swift,php,c,cpp,h}]
BasedOnStyles = Slop

# Prose. Slop only — see the note above about STE needing a project Vocab.
[*.md]
BasedOnStyles = Slop
