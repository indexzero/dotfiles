[settings]
legacy_version_file = true
experimental = true
jobs = 4

[tools]
node = "lts"
python = "latest"
# Pinned to a minor: this is only the bootstrap Go. Per-project versions come
# from `toolchain` lines in go.mod via GOTOOLCHAIN=auto, not from mise.
# Patch releases still flow (security fixes); minor bumps are deliberate.
go = "1.26"
bun = "latest"
deno = "latest"
rust = "latest"
git-cliff = "latest"
hk = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-zigbuild" = "latest"
zig = "latest"
