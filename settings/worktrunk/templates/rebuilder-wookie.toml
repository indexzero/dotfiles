# Template: .config/wt.toml for rebuilder-wookie-style repos
# Copy into a repo's .config/wt.toml and adjust topics/types as needed.
# Docs: https://worktrunk.dev/llm-commits/

[commit.generation]
template-append = """
Commit format: TYPE(TOPIC) short description in imperative mood
No colon after the closing parenthesis. Subject line soft limit: 50 chars.

Valid types:
  fix, feat, refactor, chore, doc, build, dist, test, infra, data, nit,
  close, spv, skunkworks, agents

Common topics (adjust per repo):
  argo, ci, deps, docker, duckdb, infrastructure, integration,
  lockfiles, monorepo, workflow

Rules:
- One type and one topic per commit
- Propose new types/topics rather than reusing a poor fit
- No colon, no period, no trailing punctuation on subject line
- Body lines wrap at 72 chars
"""
