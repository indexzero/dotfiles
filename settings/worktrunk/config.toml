# Worktrunk user config — ~/.config/worktrunk/config.toml
# Docs: https://worktrunk.dev/config/

# Place worktrees in a sibling directory named <repo>-worktrees/<branch>
worktree-path = "{{ repo_path }}/../{{ repo }}-worktrees/{{ branch | sanitize }}"

# Rescue untracked scratch/.worktreeinclude files from a worktree back into
# the main repo before it's removed (replaces the old git-gtr preRemove hook).
# Blocking, but wtbk exits 0 on no-op so it never aborts a removal.
pre-remove = "wtbk copy {{ worktree_path }}"

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=sonnet --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

# Personal style guidance injected into every commit prompt.
# Project .config/wt.toml can add its own template-append on top of this.
template-append = """
- Imperative mood, sentence-case, no trailing period
- Subject line soft limit: 72 characters
- Be specific: name the function, file, or flag that changed
- No vanity metrics (lines changed, number of files)
- No "this commit" or "this PR" phrasing
"""

[merge]
squash = true
commit = true
rebase = true
remove = true

[list]
summary = true
