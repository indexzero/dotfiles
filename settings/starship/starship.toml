format = """
$username\
$hostname\
$shlvl\
$directory\
$nodejs\
$golang\
$rust\
$bun\
$deno\
$terraform\
$docker_context\
$kubernetes\
$gcloud\
$fill\
$line_break\
$jobs\
$character"""

right_format = """
${custom.worktree}\
$git_branch\
$git_status\
$cmd_duration\
$status"""

add_newline = false

# ── Fill ──────────────────────────────────────────────────────────────────────
[fill]
symbol = "─"
style  = "bold black"

# ── Directory ────────────────────────────────────────────────────────────────
[directory]
format            = "[$path]($style)"
style             = "bold cyan"
truncation_length = 5
truncate_to_repo  = false
truncation_symbol = "…/"

# ── Git branch (right) ────────────────────────────────────────────────────────
[git_branch]
format = "[ $branch]($style)"
style  = "bold magenta"
symbol = " "

# ── Git status (right) ────────────────────────────────────────────────────────
[git_status]
format     = '([\[$all_status$ahead_behind\]]($style) )'
style      = "bold red"
stashed    = "\\$"
modified   = "!"
staged     = "+"
ahead      = ">"
behind     = "<"
untracked  = ""
deleted    = ""
renamed    = ""
conflicted = ""

# ── Git worktree indicator (right, linked worktrees only) ─────────────────────
# Fires when git-dir != git-common-dir, i.e. we're in a linked worktree, not main.
[custom.worktree]
disabled    = false
description = "Indicates when inside a git linked worktree"
command     = "echo ''"
when        = '[ "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)" ]'
format      = "[ wt]($style) "
style       = "bold yellow"
shell       = ["bash", "--noprofile", "--norc", "-euo", "pipefail", "-c"]

# ── Command duration (right) ──────────────────────────────────────────────────
[cmd_duration]
format   = "[took $duration]($style) "
style    = "bold yellow"
min_time = 2_000

# ── Exit status (right, non-zero only) ────────────────────────────────────────
[status]
disabled       = false
format         = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
symbol         = "✘ "
style          = "bold red"
success_symbol = ""
map_symbol     = true

# ── Node.js (mise-only) ──────────────────────────────────────────────────────
[nodejs]
format            = " [ $version]($style)"
style             = "bold green"
symbol            = " "
detect_files      = [".tool-versions", "mise.toml", ".mise.toml"]
detect_extensions = []
detect_folders    = []

# ── Go (mise-only) ───────────────────────────────────────────────────────────
[golang]
format            = " [ $version]($style)"
style             = "bold cyan"
symbol            = " "
detect_files      = [".tool-versions", "mise.toml", ".mise.toml"]
detect_extensions = []
detect_folders    = []

# ── Rust (mise-only) ─────────────────────────────────────────────────────────
[rust]
format            = " [ $version]($style)"
style             = "bold red"
symbol            = " "
detect_files      = [".tool-versions", "mise.toml", ".mise.toml"]
detect_extensions = []
detect_folders    = []

# ── Bun (mise-only) ──────────────────────────────────────────────────────────
[bun]
format            = " [ $version]($style)"
style             = "bold yellow"
symbol            = " "
detect_files      = [".tool-versions", "mise.toml", ".mise.toml"]
detect_extensions = []
detect_folders    = []

# ── Deno (mise-only) ─────────────────────────────────────────────────────────
[deno]
format            = " [ $version]($style)"
style             = "bold green"
symbol            = " "
detect_files      = [".tool-versions", "mise.toml", ".mise.toml"]
detect_extensions = []
detect_folders    = []

# ── Terraform workspace ───────────────────────────────────────────────────────
[terraform]
disabled = false
format   = " [ $workspace]($style)"
style    = "bold purple"
symbol   = "󱁢 "

# ── Python virtualenv ────────────────────────────────────────────────────────
[python]
format            = " [ $virtualenv]($style)"
style             = "bold yellow"
symbol            = " "
detect_extensions = []
detect_files      = []
detect_folders    = []

# ── Docker context (shows when non-default) ───────────────────────────────────
[docker_context]
disabled        = false
format          = " [ $context]($style)"
style           = "bold blue"
only_with_files = false

# ── Kubernetes ────────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
format   = " [ $context(\\($namespace\\))]($style)"
style    = "bold blue"

# ── gcloud ────────────────────────────────────────────────────────────────────
[gcloud]
disabled = false
format   = " [ $account(@$domain)(\\($project\\))]($style)"
style    = "bold blue"

# ── Shell depth (shows when nested ≥ 2) ──────────────────────────────────────
[shlvl]
disabled  = false
format    = "[(${shlvl})]($style) "
style     = "bold yellow"
threshold = 2

# ── Background jobs ──────────────────────────────────────────────────────────
[jobs]
format           = "[$symbol]($style)"
style            = "bold blue"
symbol           = " "
number_threshold = 1

# ── Prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ── Username (SSH only) ──────────────────────────────────────────────────────
[username]
format      = "[$user]($style) in "
style_user  = "bold yellow"
show_always = false

# ── Hostname (SSH only) ──────────────────────────────────────────────────────
[hostname]
format   = "[$hostname]($style) in "
style    = "bold green"
ssh_only = true

